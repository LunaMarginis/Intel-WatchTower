name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]   # the collector itself pushes to main every few hours: no need to test its data commits

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q watchtower tests
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
