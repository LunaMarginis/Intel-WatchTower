name: Collect

# Every 12 hours. The authenticated ThreatFox dump holds 6 months and we keep the last 7 days of it, so nothing is lost between runs, and
# two downloads a day stay well inside abuse.ch's query limits.
# The big URLhaus export is refreshed by the script itself about once a day, not on every run.
on:
  schedule:
    - cron: '17 */12 * * *'  # off the hour: GitHub's queue is busiest at :00
  workflow_dispatch:
    inputs:
      force_urls:
        description: Refresh the URLhaus export even if it is not due
        type: boolean
        default: false

# Never two runs at once: they would race on the same files.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write        # only this job can push, and only to this repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true

      # The indicators, feeds and full reports live in a private repository (abuse.ch's terms do not grant a right to republish them).
      # This public repository only receives the aggregates-only README.
      - name: Checkout private data repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: LunaMarginis/Intel-WatchTower-data
          ssh-key: ${{ secrets.DATA_REPO_DEPLOY_KEY }}   # deploy key with write access to that one repository only
          path: data
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Unit tests (cheap, and they guard the parser)
        run: python -m unittest discover -s tests -t .

      - name: Collect, check, report
        id: collect
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}   # optional: without it nothing is sent
          FORCE_URLS: ${{ inputs.force_urls }}
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}   # ThreatFox exports require it; redacted from every error message
        run: |
          if [ "$FORCE_URLS" = "true" ]; then python -m watchtower --root data --public-readme README.md --public-summary summary.json --force-urls; else python -m watchtower --root data --public-readme README.md --public-summary summary.json; fi

      - name: Commit and push the private data
        if: ${{ !cancelled() }}
        working-directory: data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Collect $(date -u +'%Y-%m-%d %H:%M') UTC"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected (attempt $attempt): rebasing and retrying"
            git pull --rebase --autostash
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the data after 3 attempts"; exit 1

      - name: Commit and push the public README (aggregates only)
        if: ${{ !cancelled() }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md summary.json
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Update summary $(date -u +'%Y-%m-%d %H:%M') UTC"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected (attempt $attempt): rebasing and retrying"
            git pull --rebase --autostash
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the README after 3 attempts"; exit 1

      - name: Tell Slack when the job itself broke
        if: ${{ failure() && steps.collect.outcome == 'failure' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # The script already posts its own report for failed data checks; this covers crashes before it could.
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          curl -fsS -m 20 -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\"Intel WatchTower: collection run failed. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "$SLACK_WEBHOOK_URL" || true
